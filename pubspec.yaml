name: labwatch
description: IoT-based laboratory monitoring, scheduling and equipment inventory app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_messaging: ^15.1.3
  firebase_storage: ^12.3.2
  cloud_functions: ^5.1.3
  # State, navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.3.0
  # Local storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  # Charts, reports (used by later modules)
  fl_chart: ^0.69.0
  pdf: ^3.11.1
  printing: ^5.13.2
  # IoT (optional MQTT path, used by later module)
  mqtt_client: ^10.5.0
  # Utilities
  intl: ^0.19.0

dev_dependencies:
  archive: 4.0.7
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_cloud_firestore: ^3.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/branding/
